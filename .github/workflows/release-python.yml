name: Release Python

on:
  push:
    tags: ["py-v*"]

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: packages/python

    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6

      - name: Check that the tag matches the package version
        run: test "py-v$(uv version --short)" = "$GITHUB_REF_NAME"

      - run: uv sync --locked

      - run: uv run mypy

      - run: uv run pytest

      - run: uv build

      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: packages/python/dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi

    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
