[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "strompt"
version = "0.1.0"
description = "An opinionated, extensible, zero-dependency structured prompt rendering library"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Archit Mehta" }]
requires-python = ">=3.11"
dependencies = []
keywords = ["prompt", "prompt-engineering", "llm", "agents", "markdown"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries",
  "Typing :: Typed",
]

[project.urls]
Repository = "https://github.com/Archit404Error/strompt"
Issues = "https://github.com/Archit404Error/strompt/issues"

[dependency-groups]
dev = [
  "hypothesis>=6.140",
  "mypy>=1.18",
  "pytest>=8.4",
  "pytest-cov>=7.0",
  "ruff>=0.14",
]

[tool.hatch.build.targets.wheel]
packages = ["src/strompt"]

[tool.hatch.build.targets.sdist]
include = ["src/strompt", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]

[tool.coverage.run]
source = ["strompt"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
